name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git describe` can resolve version tags for the
          # build badge (shallow clones fall back to a bare sha).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Foot-pixel analysis of the walk sheet: catches permuted cells or a
      # broken left-row mirror that would silently wreck the gait.
      - name: Gait check (walk sheet order)
        run: node scripts/check-gait.mjs

      - name: Build
        run: npm run build

      - name: Playtest (walk + bounce assertions, retry once)
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          npm run playtest:ci

      # Same served build, hazards ON, at phone width: asserts the narrow
      # 32x34 slime body, a real patrol corridor, and renderer-drawn eyes
      # that track the patrol. Fresh preview on its own port (steps don't
      # share background processes); one retry, like the walk playtest.
      - name: Slime playtest (phone width, retry once)
        run: |
          npx vite preview --port 4174 --strictPort &
          sleep 3
          npm run playtest:slime http://localhost:4174/ || (sleep 2 && npm run playtest:slime http://localhost:4174/)
