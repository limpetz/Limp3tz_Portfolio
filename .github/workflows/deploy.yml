name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish a previously untagged revision from the Actions tab.
  workflow_dispatch:

# Required by the Pages deployment: write the artifact and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate as ci.yml — don't publish a broken build.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Playtest (walk + bounce assertions)
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/playtest.mjs "http://localhost:4173/Limp3tz_Portfolio/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
